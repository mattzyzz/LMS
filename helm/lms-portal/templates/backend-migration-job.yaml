apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "lms.fullname" . }}-migration-{{ .Release.Revision }}
  labels:
    {{- include "lms.backend.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-upgrade,pre-install
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "lms.backend.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: OnFailure
      containers:
        - name: migration
          image: {{ include "lms.image" (dict "global" .Values.global "image" .Values.backend.image) }}
          command: ["node", "dist/main"]
          args: []
          envFrom:
            - configMapRef:
                name: {{ include "lms.fullname" . }}-backend
            - secretRef:
                name: {{ include "lms.fullname" . }}-backend
          env:
            - name: RUN_MIGRATIONS
              value: "true"
