## Global settings
global:
  imageRegistry: ""
  imagePullSecrets: []

## Backend (NestJS)
backend:
  replicaCount: 2
  image:
    repository: lms-portal/backend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3001
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    APP_PORT: "3001"
    APP_ENV: production
    DATABASE_HOST: ""      # set to your PostgreSQL host
    DATABASE_PORT: "5432"
    DATABASE_NAME: lms
    DATABASE_LOGGING: "false"
    REDIS_HOST: ""         # set to your Redis host
    REDIS_PORT: "6379"
    JWT_EXPIRES_IN: "15m"
    JWT_REFRESH_EXPIRES_IN: "7d"
    UPLOAD_DEST: /app/uploads
    MAX_FILE_SIZE: "10485760"
    SMTP_PORT: "587"
    SMTP_SECURE: "false"
    SMTP_FROM: noreply@portal.com
    COMPANY_NAME: Portal
  ## Sensitive values — override via --set or external secret
  secrets:
    DATABASE_USER: lms
    DATABASE_PASSWORD: ""
    JWT_SECRET: ""
    JWT_REFRESH_SECRET: ""
    REDIS_PASSWORD: ""
    SUPERADMIN_SECRET: ""
    SMTP_HOST: ""
    SMTP_USER: ""
    SMTP_PASSWORD: ""
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilization: 70
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  healthCheck:
    path: /api/health
    initialDelaySeconds: 30
    periodSeconds: 10
  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""
    accessMode: ReadWriteOnce
    mountPath: /app/uploads

## Frontend (Next.js)
frontend:
  replicaCount: 2
  image:
    repository: lms-portal/frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
  env:
    NEXT_PUBLIC_API_URL: ""  # set to ingress URL + /api
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilization: 70
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

## Ingress (nginx)
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/websocket-services: "lms-portal-backend"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
  host: lms.example.com
  tls:
    enabled: false
    secretName: lms-tls
